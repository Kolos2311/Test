# bot1: 1h close above Ichimoku cloud + Stoch K x D in OS + ATR% bottom 20%
# NOT confirmed before the selection window: WR 21.4% on 140 trades, p = 0.4193; keep it on paper
# Picked by research/select_live.py on 2026-10-23 from data 2024-10-23 .. 2026-10-23.
# Training-window win rate is optimistic (selection bias); the walk-forward
# out-of-sample win rate of this procedure was 22.9% (see reports/RESULTS.md).
name = "bot1"
mode = "paper"            # paper -> testnet -> mainnet (mainnet also needs HL_CONFIRM_MAINNET=yes)
coin = "BTC"
timeframe = "1h"
conditions = ["close above Ichimoku cloud", "Stoch K x D in OS", "ATR% bottom 20%"]
take_profit_pct = 1.0
stop_loss_pct = 0.25
notional_usd = 20.0       # position value in USD (Hyperliquid minimum order is 10 USD)
leverage = 5
isolated = true
max_notional_usd = 200.0
entry_slippage_pct = 0.3
max_daily_loss_usd = 5.0
max_consecutive_losses = 12
subaccount_address = ""   # testnet/mainnet with several bots: one sub-account per bot ...
secret_env = "HL_SECRET_KEY"          # ... or a separate wallet per bot: point these to its own variables
account_env = "HL_ACCOUNT_ADDRESS"
state_dir = "state"

[backtest]
train_from = "2024-10-23"
train_to = "2026-10-23"
train_trades = 74
train_win_rate = 0.3919
train_half_year_win_rates = [0.364, 0.375, 0.462, 0.400]
history_by_year = { "2020" = [22, 0.227], "2021" = [33, 0.242], "2022" = [33, 0.121], "2023" = [27, 0.296], "2024" = [30, 0.233], "2025" = [45, 0.378], "2026" = [24, 0.417] }
pre_sample = { trades = 140, win_rate = 0.2143, baseline_wr = 0.2045, p_value = 0.4193, exp_net_pct = -0.0721 }
walk_forward_oos_win_rate = 0.2293
